name: Release

# v* 태그 푸시 → 인스톨러 빌드 → GitHub Release 업로드 (앱 자동 업데이트가 이 릴리스를 감지)
# workflow_dispatch → 릴리스 없이 인스톨러만 빌드해 아티팩트로 업로드 (파이프라인 검증용 드라이런)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 태그 릴리스일 때만: 태그와 csproj 버전 일치 가드
      # (자동 업데이터 자산명 규칙 ShyshyroongDownloader_Setup_v<버전>.exe 와 어긋나는 릴리스 방지)
      - name: Verify tag matches csproj version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $csprojVer = ([xml](Get-Content "Multiplatform-Downloader/Multiplatform-Downloader.csproj")).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tagVer = "${{ github.ref_name }}".TrimStart('v')
          if ($csprojVer -ne $tagVer) { Write-Error "태그($tagVer) != csproj($csprojVer) — 버전을 맞춘 뒤 태그를 다시 푸시하세요"; exit 1 }
          Write-Output "버전 일치: $csprojVer"

      # 번들 엔진 다운로드 — git 미추적(용량). yt-dlp/ffmpeg는 체크섬 검증, 항상 최신
      # (실측 근거: 엔진 노화가 플랫폼 다운로드 실패의 근본 원인 — 릴리스마다 최신 엔진 동봉)
      - name: Fetch engines (yt-dlp / ffmpeg / ffprobe / deno)
        shell: pwsh
        run: ./Installer/fetch-engines.ps1 -ToolsDir "Multiplatform-Downloader/tools"

      - name: Publish (self-contained win-x64)
        run: dotnet publish Multiplatform-Downloader/Multiplatform-Downloader.csproj -c Release -r win-x64 --self-contained true -o Installer/publish -v minimal

      - name: Install Inno Setup + Korean language
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $lang = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages\Korean.isl"
          Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Korean.isl" -OutFile $lang
          if (-not (Test-Path $lang)) { Write-Error "Korean.isl 설치 실패"; exit 1 }

      - name: Compile installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "Installer\ShyshyroongDownloader.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem Installer/Output/*.exe | ForEach-Object { Write-Output "산출물: $($_.Name) ($([math]::Round($_.Length/1MB))MB)" }

      # 드라이런(workflow_dispatch): 릴리스 없이 아티팩트만
      - name: Upload artifact (dry-run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: installer-dry-run
          path: Installer/Output/*.exe
          retention-days: 7

      # 태그 릴리스: 자동 업데이터가 감지하는 릴리스 생성 + 자산 업로드
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Installer/Output/*.exe
          generate_release_notes: true
